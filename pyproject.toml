[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-vision"
version = "0.1.0"
description = "Image-conditioned typed decisions on top of Laya (SigLIP -> projector -> ModernBERT decision model)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Pinned: laya_vision reuses underscore-private helpers and copies DecisionModel's head
    # forward from this exact version (see laya_vision/model.py and tests/test_text_parity.py).
    "laya==0.3.21",
    "torch>=2.1",
    # 4.x is supported for machines without torch>=2.5 (e.g. Intel macOS); 5.x on training boxes.
    "transformers>=4.48,<6",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["datasets>=2.18", "accelerate>=0.30", "peft>=0.10", "tqdm"]
serve = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
eval = ["pandas", "scikit-learn", "sentencepiece"]  # sentencepiece: SigLIP tokenizer (siglip_zeroshot baseline)
dev = ["pytest>=7", "ruff", "httpx"]

[tool.setuptools.packages.find]
include = ["laya_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real checkpoints downloaded from the Hub (run with -m slow)"]
addopts = "-m 'not slow'"
